name: build-msi

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# 发布 Release 需要写权限
permissions:
  contents: write

concurrency:
  group: build-msi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 同步依赖
        run: uv sync

      - name: 校验版本号（tag 构建要求与 pyproject.toml 一致）
        shell: pwsh
        run: |
          $pyprojectVersion = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "pyproject.toml 版本: $pyprojectVersion"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
              $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
              if ($tagVersion -ne $pyprojectVersion) {
                  throw "tag $env:GITHUB_REF_NAME 与 pyproject.toml 版本 $pyprojectVersion 不一致；先改版本号再打 tag"
              }
          }

      - name: 安装 WiX
        run: dotnet tool install --global wix

      - name: 接受 WiX 7 OSMF EULA（全新环境首次使用必须，WIX7015）
        run: wix eula accept wix7

      - name: 构建 MSI（PyInstaller + Qt 裁剪 + WiX）
        run: powershell -ExecutionPolicy Bypass -File scripts/build_msi.ps1

      - name: 签名 MSI（内部自签名证书，密钥在仓库 Secrets）
        shell: pwsh
        env:
          SIGNING_PFX_B64: ${{ secrets.SIGNING_PFX_B64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_B64))
          $secure = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
          Remove-Item $pfx -Force
          # runner 上 signtool 不在 PATH，需在 Windows Kits 里定位
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin", "C:\Program Files\Windows Kits\10\bin" `
              -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\' } |
              Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          if (-not $signtool) { throw "runner 上未找到 signtool.exe（Windows Kits）" }
          $msi = (Get-ChildItem dist/AwinRPA-*.msi | Select-Object -First 1).FullName
          & $signtool sign /sha1 $cert.Thumbprint /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $msi
          if ($LASTEXITCODE -ne 0) { throw "MSI 签名失败" }
          $sig = Get-AuthenticodeSignature $msi
          if (-not $sig.SignerCertificate) { throw "签名校验失败：MSI 上没有签名" }
          Write-Host "已签名: $($sig.SignerCertificate.Subject)"

      - name: 验证静默安装/卸载（CI 以管理员运行，免 UAC）
        shell: pwsh
        run: |
          $msi = (Get-ChildItem dist/AwinRPA-*.msi | Select-Object -First 1).FullName
          $install = Start-Process msiexec -ArgumentList '/i', $msi, '/qn', '/norestart', '/l*v', 'install.log' -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "静默安装失败，退出码 $($install.ExitCode)，详见 install.log" }
          if (-not (Test-Path 'C:\Program Files\AwinRPA\AwinRPA.exe')) { throw "安装后未找到主程序" }
          $uninstall = Start-Process msiexec -ArgumentList '/x', $msi, '/qn', '/norestart' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "静默卸载失败，退出码 $($uninstall.ExitCode)" }
          Write-Host "安装/卸载验证通过"

      - name: 上传构建产物（每次运行可从 Actions 下载）
        uses: actions/upload-artifact@v4
        with:
          name: AwinRPA-msi
          path: dist/AwinRPA-*.msi
          if-no-files-found: error

      - name: 发布到 GitHub Release（仅 v* tag 触发）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $msi = (Get-ChildItem dist/AwinRPA-*.msi | Select-Object -First 1).Name
          gh release create "$tag" "dist/$msi" packaging/AwinRPA-signing.cer packaging/trust-cert.ps1 --title "$tag" --generate-notes `
            || gh release upload "$tag" "dist/$msi" packaging/AwinRPA-signing.cer packaging/trust-cert.ps1 --clobber
