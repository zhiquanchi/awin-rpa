<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWIN RPA - 模板管理和预览</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', 'Segoe UI', Tahoma, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* 页面标题 */
        .page-header {
            background: #fff;
            padding: 20px 24px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }

        .page-title {
            font-size: 20px;
            font-weight: 600;
            color: #303133;
        }

        /* 通用卡片样式 */
        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            margin-bottom: 20px;
        }

        /* 第一行：模板管理区域 */
        .template-section {
            display: flex;
            padding: 20px;
            gap: 20px;
        }

        /* 左侧模板列表 */
        .template-list-wrapper {
            width: 240px;
            display: flex;
            flex-direction: column;
        }

        .template-list {
            flex: 1;
            border: 1px solid #e4e7ed;
            border-radius: 6px;
            overflow: hidden;
            min-height: 200px;
            max-height: 300px;
            overflow-y: auto;
        }

        .template-item {
            padding: 12px 16px;
            cursor: pointer;
            border-bottom: 1px solid #ebeef5;
            transition: all 0.2s;
            font-size: 14px;
            color: #606266;
        }

        .template-item:last-child {
            border-bottom: none;
        }

        .template-item:hover {
            background: #f5f7fa;
        }

        .template-item.active {
            background: #ecf5ff;
            color: #409eff;
            font-weight: 500;
        }

        .template-list-buttons {
            display: flex;
            gap: 10px;
            margin-top: 12px;
        }

        .template-list-buttons .btn {
            flex: 1;
        }

        /* 中间预览区域 */
        .template-preview-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .preview-label {
            font-size: 14px;
            color: #606266;
            margin-bottom: 8px;
        }

        .template-preview {
            flex: 1;
            border: 1px solid #e4e7ed;
            border-radius: 6px;
            padding: 16px;
            min-height: 200px;
            max-height: 300px;
            overflow-y: auto;
            background: #fafafa;
            font-size: 14px;
            line-height: 1.8;
            color: #303133;
            white-space: pre-wrap;
        }

        .template-preview.editable {
            background: #fff;
            border-color: #409eff;
            outline: none;
        }

        .template-preview:focus {
            border-color: #409eff;
            box-shadow: 0 0 0 2px rgba(64, 158, 255, 0.1);
        }

        /* 右侧按钮列 */
        .action-column {
            width: 100px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            justify-content: flex-start;
            padding-top: 28px;
        }

        /* 按钮样式 */
        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-primary {
            background: #409eff;
            color: #fff;
        }

        .btn-primary:hover {
            background: #66b1ff;
        }

        .btn-success {
            background: #67c23a;
            color: #fff;
        }

        .btn-success:hover {
            background: #85ce61;
        }

        .btn-danger {
            background: #f56c6c;
            color: #fff;
        }

        .btn-danger:hover {
            background: #f78989;
        }

        .btn-default {
            background: #fff;
            color: #606266;
            border: 1px solid #dcdfe6;
        }

        .btn-default:hover {
            background: #ecf5ff;
            border-color: #409eff;
            color: #409eff;
        }

        .btn-large {
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 500;
        }

        /* 第二行：发送数量区域 */
        .send-count-section {
            display: flex;
            align-items: center;
            padding: 20px;
            gap: 20px;
        }

        .send-count-label {
            font-size: 14px;
            color: #606266;
            width: 80px;
        }

        .send-count-value {
            flex: 1;
            max-width: 200px;
        }

        .count-display {
            padding: 10px 16px;
            border: 1px solid #e4e7ed;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            color: #303133;
            background: #fafafa;
        }

        .count-input {
            width: 100%;
            padding: 10px 16px;
            border: 1px solid #409eff;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 500;
            color: #303133;
            background: #fff;
        }

        .count-input:focus {
            outline: none;
            box-shadow: 0 0 0 2px rgba(64, 158, 255, 0.1);
        }

        .count-unit {
            font-size: 14px;
            color: #909399;
            margin-left: 8px;
        }

        /* 第三行：执行区域 */
        .execution-section {
            display: flex;
            padding: 20px;
            gap: 20px;
        }

        .execute-button-wrapper {
            display: flex;
            align-items: flex-start;
        }

        /* 日志区域 */
        .log-wrapper {
            flex: 1;
            border: 1px solid #e4e7ed;
            border-radius: 6px;
            overflow: hidden;
        }

        .log-header {
            background: #f5f7fa;
            padding: 12px 16px;
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            color: #303133;
            border-bottom: 1px solid #e4e7ed;
        }

        .log-content {
            padding: 16px;
            min-height: 150px;
            max-height: 250px;
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 13px;
            line-height: 1.6;
            color: #606266;
            background: #fafafa;
        }

        .log-item {
            margin-bottom: 4px;
        }

        .log-time {
            color: #909399;
            margin-right: 8px;
        }

        .log-success {
            color: #67c23a;
        }

        .log-error {
            color: #f56c6c;
        }

        .log-info {
            color: #409eff;
        }

        /* 空状态 */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: #909399;
        }

        .empty-icon {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .empty-text {
            font-size: 14px;
        }

        /* 分隔线 */
        .divider {
            height: 1px;
            background: #e4e7ed;
            margin: 0 20px;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="app-container">
            <!-- 页面标题 -->
            <div class="page-header">
                <h1 class="page-title">模板管理和预览</h1>
            </div>

            <!-- 主内容卡片 -->
            <div class="card">
                <!-- 第一行：模板管理区域 -->
                <div class="template-section">
                    <!-- 左侧：模板列表 -->
                    <div class="template-list-wrapper">
                        <div class="template-list">
                            <div 
                                v-for="template in templates" 
                                :key="template.id"
                                class="template-item"
                                :class="{ active: selectedTemplate?.id === template.id }"
                                @click="selectTemplate(template)"
                            >
                                {{ template.name }}
                            </div>
                            <div v-if="templates.length === 0" class="empty-state">
                                <div class="empty-text">暂无模板</div>
                            </div>
                        </div>
                        <div class="template-list-buttons">
                            <button class="btn btn-primary" @click="addTemplate">增加</button>
                            <button class="btn btn-danger" @click="deleteTemplate">删除</button>
                        </div>
                    </div>

                    <!-- 中间：模板预览 -->
                    <div class="template-preview-wrapper">
                        <div class="preview-label">模板内容预览</div>
                        <div 
                            v-if="selectedTemplate"
                            class="template-preview"
                            :class="{ editable: isTemplateEditing }"
                            :contenteditable="isTemplateEditing"
                            @input="onTemplateInput"
                            ref="templatePreview"
                        >{{ isTemplateEditing ? editingTemplateContent : selectedTemplate.content }}</div>
                        <div v-else class="template-preview">
                            <div class="empty-state">
                                <div class="empty-icon">📄</div>
                                <div class="empty-text">请从左侧选择一个模板</div>
                            </div>
                        </div>
                    </div>

                    <!-- 右侧：按钮列 -->
                    <div class="action-column">
                        <template v-if="!isTemplateEditing">
                            <button class="btn btn-default" @click="startTemplateEdit" :disabled="!selectedTemplate">修改</button>
                        </template>
                        <template v-else>
                            <button class="btn btn-success" @click="saveTemplateEdit">保存</button>
                            <button class="btn btn-default" @click="cancelTemplateEdit">取消</button>
                        </template>
                    </div>
                </div>

                <div class="divider"></div>

                <!-- 第二行：发送数量区域 -->
                <div class="send-count-section">
                    <div class="send-count-label">发送数量</div>
                    <div class="send-count-value">
                        <template v-if="!isCountEditing">
                            <span class="count-display">{{ sendCount }}</span>
                        </template>
                        <template v-else>
                            <input 
                                type="number" 
                                class="count-input" 
                                v-model.number="editingCount"
                                min="1"
                            >
                        </template>
                    </div>
                    <span class="count-unit">个</span>
                    
                    <!-- 右侧：按钮列 -->
                    <div class="action-column" style="padding-top: 0;">
                        <template v-if="!isCountEditing">
                            <button class="btn btn-default" @click="startCountEdit">修改</button>
                        </template>
                        <template v-else>
                            <button class="btn btn-success" @click="saveCountEdit">保存</button>
                            <button class="btn btn-default" @click="cancelCountEdit">取消</button>
                        </template>
                    </div>
                </div>

                <div class="divider"></div>

                <!-- 第三行：执行区域 -->
                <div class="execution-section">
                    <!-- 左侧：开始执行按钮 -->
                    <div class="execute-button-wrapper">
                        <button 
                            class="btn btn-large" 
                            :class="isRunning ? 'btn-danger' : 'btn-success'"
                            @click="toggleExecution"
                        >
                            {{ isRunning ? '停止执行' : '开始执行' }}
                        </button>
                    </div>

                    <!-- 右侧：日志区域 -->
                    <div class="log-wrapper">
                        <div class="log-header">执行日志</div>
                        <div class="log-content" ref="logContent">
                            <div v-if="logs.length === 0" class="empty-state" style="padding: 20px;">
                                <div class="empty-text">暂无日志</div>
                            </div>
                            <div 
                                v-for="(log, index) in logs" 
                                :key="index" 
                                class="log-item"
                                :class="'log-' + log.type"
                            >
                                <span class="log-time">[{{ log.time }}]</span>
                                <span>{{ log.message }}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, nextTick } = Vue

        createApp({
            setup() {
                // 模板数据
                const templates = ref([
                    { id: 1, name: '邀请模板1', content: '尊敬的合作伙伴：\n\n您好！我们诚挚地邀请您加入我们的合作计划。\n\n期待您的回复！\n\n此致\n敬礼' },
                    { id: 2, name: '邀请模板2', content: 'Hi，\n\n我们注意到您在该领域有丰富的经验，希望能与您建立合作关系。\n\n如有兴趣，请回复此消息。\n\n谢谢！' },
                    { id: 3, name: '跟进模板', content: '您好！\n\n之前发送的合作邀请不知您是否有时间查看？\n\n如有任何问题，欢迎随时沟通。\n\n期待您的回复！' },
                ])

                const selectedTemplate = ref(null)
                const isTemplateEditing = ref(false)
                const editingTemplateContent = ref('')
                const templatePreview = ref(null)

                // 发送数量
                const sendCount = ref(10)
                const isCountEditing = ref(false)
                const editingCount = ref(10)

                // 执行状态
                const isRunning = ref(false)
                const logs = ref([])
                const logContent = ref(null)

                // 模板操作
                const selectTemplate = (template) => {
                    if (isTemplateEditing.value) {
                        if (!confirm('您正在编辑模板，切换将丢失未保存的更改，是否继续？')) {
                            return
                        }
                        isTemplateEditing.value = false
                    }
                    selectedTemplate.value = template
                }

                const addTemplate = () => {
                    const newId = Math.max(...templates.value.map(t => t.id), 0) + 1
                    const newTemplate = {
                        id: newId,
                        name: `新模板${newId}`,
                        content: '请输入模板内容...'
                    }
                    templates.value.push(newTemplate)
                    selectedTemplate.value = newTemplate
                }

                const deleteTemplate = () => {
                    if (!selectedTemplate.value) {
                        alert('请先选择要删除的模板')
                        return
                    }
                    if (confirm(`确定要删除模板"${selectedTemplate.value.name}"吗？`)) {
                        const index = templates.value.findIndex(t => t.id === selectedTemplate.value.id)
                        templates.value.splice(index, 1)
                        selectedTemplate.value = templates.value.length > 0 ? templates.value[0] : null
                    }
                }

                const startTemplateEdit = () => {
                    if (!selectedTemplate.value) return
                    editingTemplateContent.value = selectedTemplate.value.content
                    isTemplateEditing.value = true
                    nextTick(() => {
                        if (templatePreview.value) {
                            templatePreview.value.focus()
                        }
                    })
                }

                const onTemplateInput = (e) => {
                    editingTemplateContent.value = e.target.innerText
                }

                const saveTemplateEdit = () => {
                    if (selectedTemplate.value) {
                        selectedTemplate.value.content = editingTemplateContent.value
                    }
                    isTemplateEditing.value = false
                    addLog('success', '模板保存成功')
                }

                const cancelTemplateEdit = () => {
                    isTemplateEditing.value = false
                    editingTemplateContent.value = ''
                }

                // 发送数量操作
                const startCountEdit = () => {
                    editingCount.value = sendCount.value
                    isCountEditing.value = true
                }

                const saveCountEdit = () => {
                    sendCount.value = editingCount.value
                    isCountEditing.value = false
                    addLog('success', `发送数量已更新为 ${sendCount.value} 个`)
                }

                const cancelCountEdit = () => {
                    isCountEditing.value = false
                    editingCount.value = sendCount.value
                }

                // 执行操作
                const toggleExecution = () => {
                    if (isRunning.value) {
                        stopExecution()
                    } else {
                        startExecution()
                    }
                }

                let executionInterval = null

                const startExecution = () => {
                    if (!selectedTemplate.value) {
                        alert('请先选择一个模板')
                        return
                    }
                    
                    isRunning.value = true
                    addLog('info', '开始执行任务...')
                    addLog('info', `使用模板: ${selectedTemplate.value.name}`)
                    addLog('info', `计划发送数量: ${sendCount.value} 个`)

                    let count = 0
                    executionInterval = setInterval(() => {
                        count++
                        if (count <= sendCount.value) {
                            addLog('success', `第 ${count}/${sendCount.value} 条消息发送成功`)
                        }
                        if (count >= sendCount.value) {
                            clearInterval(executionInterval)
                            isRunning.value = false
                            addLog('info', '任务执行完成！')
                        }
                    }, 1000)
                }

                const stopExecution = () => {
                    if (executionInterval) {
                        clearInterval(executionInterval)
                    }
                    isRunning.value = false
                    addLog('error', '任务已手动停止')
                }

                const addLog = (type, message) => {
                    const now = new Date()
                    const time = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}:${now.getSeconds().toString().padStart(2, '0')}`
                    logs.value.push({ type, time, message })
                    
                    nextTick(() => {
                        if (logContent.value) {
                            logContent.value.scrollTop = logContent.value.scrollHeight
                        }
                    })
                }

                return {
                    templates,
                    selectedTemplate,
                    isTemplateEditing,
                    editingTemplateContent,
                    templatePreview,
                    selectTemplate,
                    addTemplate,
                    deleteTemplate,
                    startTemplateEdit,
                    onTemplateInput,
                    saveTemplateEdit,
                    cancelTemplateEdit,
                    sendCount,
                    isCountEditing,
                    editingCount,
                    startCountEdit,
                    saveCountEdit,
                    cancelCountEdit,
                    isRunning,
                    logs,
                    logContent,
                    toggleExecution
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
